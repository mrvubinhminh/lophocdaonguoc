<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tìm hiểu bài mới</title>
<meta name="description" content="Công cụ học tập tương tác: giáo viên tải file Excel câu hỏi – đáp án, tạo bài kéo thả cho học sinh hoặc giảng bài trên lớp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style id="css-main">
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --surface:rgba(255,253,248,.95); --text:#2b2520; --muted:#665c51; --line:#dfd3bf;
  --primary:#b84a1f; --primary-ink:#fff; --primary-soft:rgba(184,74,31,.1);
  --ok:#1b6e3a; --ok-bg:#e3f3e8; --err:#b42318; --err-bg:#fdebe9; --warn:#8a5a00; --warn-bg:#fff4d6;
  --veil:rgba(255,250,240,.25);
  --radius:.9rem; --s1:.25rem; --s2:.5rem; --s3:1rem; --s4:1.5rem; --s5:2.5rem;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 2px rgb(0 0 0/.08),0 6px 18px rgb(0 0 0/.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1a1714;--paper:#2a2520;--surface:rgba(36,32,28,.95);--text:#f3ede4;--muted:#bdb1a1;--line:#4a4137;
    --primary:#f0875a;--primary-ink:#1a1714;--primary-soft:rgba(240,135,90,.14);
    --ok:#6fd08f;--ok-bg:#16301f;--err:#ff8f84;--err-bg:#3a1a17;--warn:#ffd27a;--warn-bg:#3a2f12;--veil:rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.mode-board{font-size:clamp(17px,1.45vw,30px)}
body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font:400 1rem/1.55 var(--font)}
#bg{position:fixed;inset:0;z-index:-1;background:var(--bg) center/cover no-repeat}
#bg.has-img::after{content:"";position:absolute;inset:0;background:var(--veil)}
h1,h2{line-height:1.25}
.screen{max-width:72rem;margin:0 auto;padding:var(--s3)}
html.mode-board .screen{max-width:none;padding:var(--s3) var(--s4)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{margin:0;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.lead{margin:0;color:var(--muted)}
.panel{background:var(--surface);border-radius:calc(var(--radius) + .2rem);box-shadow:var(--shadow);padding:var(--s4)}

/* Nút và ô nhập */
.btn{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--paper);color:var(--text);border-radius:.7rem;
  padding:.55rem 1rem;min-height:2.9rem;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);border-color:var(--primary)}
.btn-ghost{background:transparent}
.btn-sm{min-height:2.75rem;padding:.35rem .8rem;font-size:.9rem}
.btn-lg{min-height:3.4rem;font-size:1.1rem;padding:.7rem 1.5rem}
label{display:block;font-weight:600;margin:var(--s3) 0 .25rem}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--paper);border:2px solid var(--line);
  border-radius:.6rem;padding:.65rem .8rem;min-height:2.9rem}
input:focus,textarea:focus,select:focus{outline:3px solid var(--primary-soft);border-color:var(--primary)}
.err{color:var(--err);min-height:1.3em;font-size:.88rem;font-weight:600}

/* Màn hình nhập tên, lớp */
.intro{min-height:100vh;display:grid;place-items:center}
.intro-panel{width:100%;max-width:34rem}
.intro-panel h1{margin:.2rem 0 .6rem;font-size:clamp(1.5rem,4vw,2.1rem)}
.intro-panel .btn-lg{width:100%;margin-top:var(--s3)}
.intro-extra{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}

/* Thanh trạng thái */
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);padding:.6rem var(--s3);background:var(--surface);
  border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:var(--s3)}
.gbar .who{font-weight:700;margin-right:auto}
.gbar .who small{font-weight:500;color:var(--muted)}
.dots{display:flex;gap:.4rem;align-items:center}
.dot{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:.85rem;font-weight:700}
.dot.now{border-color:var(--primary);color:var(--primary)}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.chips{display:flex;gap:var(--s2)}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:.1rem .75rem;font-weight:600;font-size:.9rem;font-variant-numeric:tabular-nums}

/* Khu kéo thả */
.board{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s4);align-items:start}
@media (min-width:1000px){
  .board{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  .qcol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);align-items:start}
  .qcol .col-title{grid-column:1/-1;justify-self:start;margin:0}
  .qcol .qrow{margin-bottom:0}
}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.acol{position:sticky;top:var(--s3)}
@media (max-width:820px){.acol{position:static}}
.col-title{margin:0 0 var(--s2);font-size:.95rem;display:inline-block;background:var(--surface);padding:.25rem .8rem;border-radius:999px;box-shadow:var(--shadow)}
.qrow{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:var(--s3);margin-bottom:var(--s3);
  box-shadow:var(--shadow);transition:border-color .2s}
.qrow.done{border-color:var(--ok)}
.q-head{display:flex;gap:var(--s3);align-items:flex-start}
.q-num{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700}
.q-body{min-width:0}
.q-tag{display:inline-block;font-size:.72em;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:.05rem .55rem;border-radius:999px;margin-bottom:.25rem}
.q-text{font-weight:600;overflow-wrap:anywhere;white-space:pre-line}
.slot{margin-top:var(--s3);min-height:3.4rem;border:2px dashed var(--muted);border-radius:.65rem;display:flex;align-items:center;justify-content:center;
  padding:.5rem .75rem;text-align:center;color:var(--muted);font-size:.9rem;transition:border-color .15s,background .15s}
.slot:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.slot.over{border-color:var(--primary);border-style:solid;background:var(--primary-soft)}
.slot.bad{border-color:var(--err);border-style:solid;background:var(--err-bg);color:var(--err);font-weight:700;animation:shake .4s}
.slot.filled{border:2px solid var(--ok);background:var(--ok-bg);color:var(--text);font-size:1rem;justify-content:flex-start;text-align:left}
.pool{display:grid;gap:var(--s3)}
.ans-card{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:var(--radius);padding:.8rem 1rem;box-shadow:var(--shadow);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;overflow-wrap:anywhere;font-weight:500;white-space:pre-line}
.ans-card:hover{border-color:var(--primary)}
.ans-card:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ans-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft),var(--shadow)}
.ans-card.dragging{opacity:.35}
.ans-card.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;transform:rotate(-1.5deg);box-shadow:0 14px 34px rgb(0 0 0/.3);cursor:grabbing}
.slot .ans-card{border:0;background:transparent;box-shadow:none;padding:0;cursor:default;touch-action:auto}
.tick{color:var(--ok);font-weight:800;margin-right:.4rem}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Hộp thoại giữa các vòng */
.modal{position:fixed;inset:0;z-index:900;display:grid;place-items:center;background:rgb(0 0 0/.45);padding:var(--s3)}
.modal .panel{max-width:30rem;width:100%;text-align:center}
.modal h2{margin:.3rem 0}
.big-emoji{font-size:3rem}

/* Tổng kết */
.sum{max-width:44rem;margin:var(--s4) auto}
.sum-hero{text-align:center}
.sum-hero h1{margin:.2rem 0;font-size:clamp(1.4rem,4vw,2rem)}
.stars{font-size:2.2rem;letter-spacing:.2rem;color:#d49a00}
.stars .off{color:var(--line)}
.score{font-size:3.5rem;font-weight:800;line-height:1.1;color:var(--primary)}
.score small{font-size:1.2rem;color:var(--muted);font-weight:600}
.praise{font-size:1.1rem;margin:var(--s3) 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:var(--s3);margin:var(--s4) 0}
.fact{background:var(--paper);border:2px solid var(--line);border-radius:.8rem;padding:.7rem;text-align:center}
.fact b{display:block;font-size:1.1rem}
.fact span{color:var(--muted);font-size:.85rem}
.sum-actions{display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:center;margin-top:var(--s3)}
.sum .panel + .panel{margin-top:var(--s3)}
.review{text-align:left}
.review h2{font-size:1.05rem;margin:0 0 var(--s2)}
.review ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.review li{background:var(--paper);border:2px solid var(--line);border-radius:.7rem;padding:.6rem .8rem}
.rv-a{color:var(--ok);font-weight:600;margin-top:.2rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:950;overflow:hidden}
.confetti i{position:absolute;top:-1rem;width:.6rem;height:1rem;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* Thông báo */
.toast{position:fixed;left:50%;bottom:var(--s4);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1.1rem;
  border-radius:.7rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3000;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
code{font-family:ui-monospace,Consolas,monospace;background:var(--paper);border:1px solid var(--line);border-radius:.3rem;padding:0 .3rem}

/* Giao diện (chủ đề màu). Ghi đè các biến màu của :root */
html[data-theme="warm"]{color-scheme:light;--bg:#f6f1e7;--paper:#fffdf8;--surface:rgba(255,253,248,.95);--text:#2b2520;--muted:#665c51;--line:#dfd3bf;
  --primary:#b84a1f;--primary-ink:#fff;--primary-soft:rgba(184,74,31,.1);--ok:#1b6e3a;--ok-bg:#e3f3e8;--err:#b42318;--err-bg:#fdebe9;--warn:#8a5a00;--warn-bg:#fff4d6;--veil:rgba(255,250,240,.25)}
html[data-theme="ocean"]{color-scheme:light;--bg:#eaf4fb;--paper:#ffffff;--surface:rgba(255,255,255,.94);--text:#10263a;--muted:#4a6275;--line:#c5dbea;
  --primary:#0b66b2;--primary-ink:#fff;--primary-soft:rgba(11,102,178,.1);--ok:#1b6e3a;--ok-bg:#e3f3e8;--err:#b42318;--err-bg:#fdebe9;--warn:#8a5a00;--warn-bg:#fff4d6;--veil:rgba(234,244,251,.25)}
html[data-theme="forest"]{color-scheme:light;--bg:#eef5ec;--paper:#ffffff;--surface:rgba(255,255,255,.94);--text:#1b2b1d;--muted:#52634f;--line:#cddcc8;
  --primary:#2e7d32;--primary-ink:#fff;--primary-soft:rgba(46,125,50,.1);--ok:#1b6e3a;--ok-bg:#e3f3e8;--err:#b42318;--err-bg:#fdebe9;--warn:#8a5a00;--warn-bg:#fff4d6;--veil:rgba(238,245,236,.25)}
html[data-theme="rose"]{color-scheme:light;--bg:#fceef3;--paper:#ffffff;--surface:rgba(255,255,255,.94);--text:#2d1b24;--muted:#6b4a58;--line:#ecc9d7;
  --primary:#b4235f;--primary-ink:#fff;--primary-soft:rgba(180,35,95,.1);--ok:#1b6e3a;--ok-bg:#e3f3e8;--err:#b42318;--err-bg:#fdebe9;--warn:#8a5a00;--warn-bg:#fff4d6;--veil:rgba(252,238,243,.25)}
html[data-theme="night"]{color-scheme:dark;--bg:#0f1226;--paper:#1a1e3a;--surface:rgba(26,30,58,.95);--text:#eef0ff;--muted:#aab0d6;--line:#343a6b;
  --primary:#7c9cff;--primary-ink:#0f1226;--primary-soft:rgba(124,156,255,.16);--ok:#6fd08f;--ok-bg:#12301f;--err:#ff8f84;--err-bg:#3a1a22;--warn:#ffd27a;--warn-bg:#3a2f12;--veil:rgba(0,0,0,.35)}

/* Ô chọn giao diện ở màn hình nhập tên */
.themes{border:0;padding:0;margin:var(--s3) 0 0}
.themes legend{font-weight:600;padding:0;margin-bottom:.4rem}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem}
.sw{position:relative;display:block;margin:0;font-weight:600}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw-card{display:flex;align-items:center;gap:.5rem;min-height:2.9rem;padding:.35rem .6rem;border:2px solid var(--line);border-radius:.7rem;background:var(--paper);font-size:.92rem}
.sw-dot{width:1.6rem;height:1.6rem;border-radius:50%;flex:none;border:2px solid var(--line)}
.sw input:checked + .sw-card{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.sw input:checked + .sw-card::after{content:"✓";margin-left:auto;color:var(--primary);font-weight:800}
.sw input:focus-visible + .sw-card{outline:3px solid var(--primary);outline-offset:2px}

.submit-status{margin:.6rem 0 0;font-weight:600;min-height:1.4em}
.submit-status.ok{color:var(--ok)}
.submit-status.err{color:var(--err)}
.submit-status.wait{color:var(--muted)}

.q-hint{margin-top:var(--s2);padding:.6rem .8rem;border-radius:.65rem;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:.95rem;line-height:1.5;border:1px solid currentColor;animation:hintIn .25s ease-out}
@keyframes hintIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.q-hint{animation:none}}
.rv-h{margin-top:.2rem;color:var(--warn);font-size:.92rem}

/* Form đầy đủ và màn khởi động tinh thần */
.intro:has(.warm),.intro:has(#introForm){align-items:start}
.intro-panel:has(.two){max-width:40rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.theme-grid.wide{grid-template-columns:repeat(auto-fill,minmax(14rem,1fr))}
.sw-dot.emo{background:none;border:0;font-size:1.5rem;width:auto;height:auto;line-height:1}
.err:empty{display:none}
.warm{text-align:center}
.breath{position:relative;height:10rem;display:grid;place-items:center;margin:.5rem 0}
.breath-ring{width:6.5rem;height:6.5rem;border-radius:50%;background:var(--primary-soft);border:4px solid var(--primary);transform:scale(.7);transition:transform 3s ease-in-out}
.breath-ring.in{transform:scale(1.4)}
.breath-text{position:absolute;font-weight:700;color:var(--primary)}
@media (prefers-reduced-motion:reduce){.breath-ring{transition:none}}
.resolve{font-size:1.05rem;margin:.6rem 0}
.goal-line{font-weight:700;margin:.6rem 0}
.goal-line.ok{color:var(--ok)}
.goal-line.near{color:var(--warn)}
@media (max-width:420px){.two{grid-template-columns:1fr 1fr}}

/* Vòng Vận dụng */
.vd .vd-card{max-width:48rem;margin:var(--s4) auto}
.vd-q{font-size:1.15rem;line-height:1.6;margin:.4rem 0 var(--s3)}
.vd-img{margin:0 0 var(--s3);text-align:center}
.vd-img img{max-width:100%;max-height:42vh;object-fit:contain;border-radius:.7rem;border:2px solid var(--line);background:#fff}
.vd-opts{display:grid;gap:.6rem}
.vd-opt{display:flex;gap:.8rem;align-items:center;text-align:left;font:inherit;color:var(--text);background:var(--paper);border:2px solid var(--line);border-radius:.8rem;padding:.7rem .9rem;min-height:3.2rem;cursor:pointer;width:100%}
.vd-opt:hover:not(:disabled),.vd-opt:focus-visible{border-color:var(--primary);background:var(--primary-soft);outline:none}
.vd-l{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);font-weight:800}
.vd-t{flex:1;overflow-wrap:anywhere}
.vd-opt.good{border-color:var(--ok);background:var(--ok-bg);opacity:1}
.vd-opt.bad{border-color:var(--err);background:var(--err-bg);text-decoration:line-through;opacity:.8}
.vd-opt:disabled{cursor:default}
.vd-fb{margin-top:var(--s3)}
.vd-ok{color:var(--ok);font-weight:800;font-size:1.1rem}
.vd-no{color:var(--err);font-weight:700}
.vd-exp{margin:.5rem 0 var(--s3);padding:.7rem .9rem;border-radius:.7rem;background:var(--warn-bg);color:var(--text);line-height:1.55}
html.mode-board .vd .vd-card{max-width:70rem}

.credit{margin:var(--s4) 0 0;text-align:center;color:var(--muted);font-size:.85rem}

.retry-line{margin:.4rem 0;font-size:.98rem;line-height:1.6;color:var(--muted)}
.retry-line b{color:var(--text)}
.retry-hint{margin:.6rem 0;padding:.7rem .9rem;border-radius:.7rem;background:var(--warn-bg);color:var(--text);line-height:1.55;text-align:left}

/* ===== Màn hình làm bài: vừa khít khung nhìn (16:9 và điện thoại dọc), chữ tự co giãn bằng --pf ===== */
html.fit,html.fit body{height:100%;overflow:hidden;overscroll-behavior:none}
.screen.play{max-width:none;margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:.4rem;box-sizing:border-box;overflow:hidden;
  padding:max(.35rem,env(safe-area-inset-top)) max(.45rem,env(safe-area-inset-right)) max(.35rem,env(safe-area-inset-bottom)) max(.45rem,env(safe-area-inset-left));font-size:var(--pf,16px)}
html.mode-board .screen.play{padding:max(.35rem,env(safe-area-inset-top)) max(.6rem,env(safe-area-inset-right)) max(.35rem,env(safe-area-inset-bottom)) max(.6rem,env(safe-area-inset-left))}
.screen.play .gbar{flex:none;margin:0;padding:.25rem .6rem;gap:.2rem .6rem;font-size:clamp(12px,var(--pf,16px),20px)}
.screen.play .gbar .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen.play .dot{width:1.7em;height:1.7em;font-size:.8em}
.screen.play .chip{padding:0 .55em;font-size:.82em}
.screen.play .gbar .btn-sm{min-height:2.4rem;padding:.2rem .6rem}
.screen.play .board{flex:1;min-height:0;display:grid;gap:.45rem;align-items:stretch;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,3fr) minmax(0,2fr)}
.screen.play .qcol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:.45rem;min-height:0;min-width:0;align-items:stretch}
.screen.play .acol{position:static;min-height:0;min-width:0;display:flex;flex-direction:column}
.screen.play .pool{flex:1;min-height:0;display:grid;gap:.45rem;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
@media (min-aspect-ratio:11/10){
  .screen.play .board{grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
  .screen.play .pool{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr))}
}

@keyframes ceFade{from{opacity:0}to{opacity:1}}
.ce-rays{position:absolute;left:50%;top:38%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);display:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,var(--ray,rgba(255,226,120,.55)) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);animation:ceSpin 40s linear infinite}
.celeb.win .ce-rays{display:block}
@keyframes ceSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#ceCanvas{position:absolute;inset:0;width:100%;height:100%}
.ce-text{position:relative;z-index:2;pointer-events:none;padding:0 5vw;max-width:96vw;display:flex;flex-direction:column;align-items:center;gap:clamp(.3rem,1.6vh,1rem)}
.ce-cake,.ce-trophy{font-size:clamp(3.5rem,13vh,8rem);line-height:1;filter:drop-shadow(0 6px 24px rgba(255,200,60,.65));opacity:0}

.ce-kicker{max-width:92vw;text-align:center;font-weight:800;letter-spacing:.14em;font-size:clamp(1rem,3.6vh,2.1rem);color:#ffe9a8;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.ce-name{font-weight:900;font-size:clamp(2.2rem,12vh,7.5rem);line-height:1.08;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.55);max-width:92vw;overflow-wrap:anywhere}
.celeb.birthday .ce-name{animation:ceHue 6s linear infinite}
.celeb.birthday .ce-name .ce-l{color:hsl(calc(var(--i)*37 + 330) 95% 72%);text-shadow:0 0 22px rgba(255,255,255,.35),0 4px 26px rgba(0,0,0,.55)}
.celeb.win .ce-name .ce-l{color:var(--name);text-shadow:0 0 18px rgba(var(--glow),.85),0 0 46px rgba(var(--glow),.5),0 4px 22px rgba(0,0,0,.6);animation-name:cePop,ceGlow}
.celeb.win .ce-text.in .ce-name .ce-l{animation:cePop .7s cubic-bezier(.2,1.6,.4,1) calc(.35s + var(--i)*45ms) both,ceGlow 2.4s ease-in-out calc(1.4s + var(--i)*60ms) infinite}
@keyframes ceHue{to{filter:hue-rotate(360deg)}}
@keyframes ceGlow{0%,100%{color:var(--name)}50%{color:#fff}}
.ce-l,.ce-sp{display:inline-block;opacity:0}
.ce-sp{width:.3em}
.ce-text.in .ce-l{animation:cePop .7s cubic-bezier(.2,1.6,.4,1) calc(.35s + var(--i)*45ms) both}
.ce-line{height:4px;width:0;border-radius:4px;background:linear-gradient(90deg,transparent,#ffd166,transparent)}

.ce-sub{font-size:clamp(1rem,3.4vh,2rem);color:#fff;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.6);max-width:80vw}
.ce-text.in .ce-sub{animation:ceRise .9s ease 1.7s both}
@keyframes ceDrop{from{opacity:0;transform:translateY(-60px) scale(.3) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes ceBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

.ce-text:not(.in) .ce-cake,.ce-text:not(.in) .ce-trophy,.ce-text:not(.in) .ce-l{opacity:0}

function driveId(u) {
  const m = u.match(/\/file\/d\/([\w-]{10,})/) || u.match(/[?&]id=([\w-]{10,})/) || u.match(/\/d\/([\w-]{10,})/);

function imgCandidates(u) {

  if (!u) return [];

  if (/drive\.google\.com|docs\.google\.com/i.test(u)) {
    const id = driveId(u);
    if (!id) return [];
    return ['https://lh3.googleusercontent.com/d/' + id + '=w2000', 'https://drive.google.com/thumbnail?id=' + id + '&sz=w2000', 'https://drive.google.com/uc?export=view&id=' + id];
  }
  if (/dropbox\.com/i.test(u)) return [u.replace(/([?&])dl=0/, '$1raw=1')];
  return [u];
}

  if (!c.length) return Promise.resolve(false);
  return new Promise(res => {
    let i = 0;
    const next = () => {
      if (i >= c.length) return res(false);

  });
}

const keyOf = s => String(s).replace(/\s+/g, ' ').trim().toLowerCase();

/* Chọn tối đa 12 câu: 3 vòng x 4 câu. pick = 'random' | 'spread' (rải đều theo thứ tự SGK).
   Mỗi lần làm đều đảo thứ tự câu trong vòng, và cố gắng khác thứ tự của lần làm trước (prevSig). */
function buildSession(qa, pick, prevSig, vdPool) {
  const pool = (qa || []).filter(x => x && x.q && x.a);
  const n = pool.length, rounds = Math.min(3, Math.floor(n / 4));
  if (rounds < 1) return null;
  const need = rounds * 4;
  let items, sig;
  for (let t = 0; t < 8; t++) {
    let chosen;
    if (pick === 'spread') { chosen = []; for (let i = 0; i < need; i++) chosen.push(pool[Math.floor(i * n / need)]); }
    else chosen = shuffle(pool).slice(0, need);
    items = chosen.map(x => ({ q: x.q, a: x.a, h: x.h || '', key: keyOf(x.a), wrong: 0, done: false, score: 0 }));
    if (pick === 'spread') { const out = []; for (let r = 0; r < rounds; r++) out.push(...shuffle(items.slice(r * 4, r * 4 + 4))); items = out; }
    sig = items.map(x => x.key).join('\u241f');
    if (sig !== prevSig) break;
  }
  const vd = shuffle((vdPool || []).filter(x => x && x.q && x.a && x.d && x.d.length)).slice(0, 3).map(x => ({
    q: x.q, a: x.a, d: x.d, h: x.e || '', img: x.img || '', opts: shuffle([x.a].concat(x.d)), key: keyOf(x.q + '|' + x.a), wrong: 0, done: false, score: 0, t: 'vd' }));
  /* Mỗi vòng thêm 1 đáp án nhiễu: lấy từ câu không có trong vòng này */
  const chosenKeys = new Set(items.map(x => x.key));
  const spare = shuffle(pool.filter(x => !chosenKeys.has(keyOf(x.a))));
  const decoys = [];
  for (let r = 0; r < rounds; r++) {
    const mine = new Set(items.slice(r * 4, r * 4 + 4).map(x => x.key));
    const others = shuffle(items.filter((x, i) => Math.floor(i / 4) !== r && !mine.has(x.key)).map(x => ({ a: x.a })));
    const c = spare.find(x => !mine.has(keyOf(x.a)) && !decoys.some(d => d && d.a === x.a)) || others[0];
    decoys.push(c ? { a: c.a } : null);
  }
  return { rounds, items, sig, vd, decoys };
}

<script id="js-teacher">
(function(){

/* ---------- Đọc Excel ---------- */
function parseRows(rows) {
  const cell = v => String(v == null ? '' : v).trim();
  let out = rows.map(r => ({ q: cell(r[0]), a: cell(r[1]), h: cell(r[2]) })).filter(x => x.q || x.a);
  if (out.length && /^\s*(a\s*[.:)\-]\s*)?(câu hỏi|cau hoi|question)/i.test(out[0].q) && /^\s*(b\s*[.:)\-]\s*)?(đáp án|dap an|answer)/i.test(out[0].a)) out.shift();
  const skipped = out.filter(x => !x.q || !x.a).length;
  return { qa: out.filter(x => x.q && x.a), skipped };
}
async function readExcel(file) {

    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', codepage: 65001 });

  } catch (e) { toast('Không đọc được file này. Hãy lưu lại thành .xlsx rồi thử lại.'); }
}
/* Vòng Vận dụng: A câu hỏi/tình huống, B đáp án đúng, C–E phương án nhiễu, F giải thích, G link ảnh */
function parseVd(rows) {
  const cell = v => String(v == null ? '' : v).trim();
  let out = rows.map(r => ({ q: cell(r[0]), a: cell(r[1]), d: [cell(r[2]), cell(r[3]), cell(r[4])].filter(Boolean), e: cell(r[5]), img: cell(r[6]) })).filter(x => x.q || x.a);
  if (out.length && /^\s*(a\s*[.:)\-]\s*)?(tình huống|tinh huong|câu hỏi|cau hoi|vận dụng|van dung)/i.test(out[0].q) && /^\s*(b\s*[.:)\-]\s*)?(đáp án|dap an)/i.test(out[0].a)) out.shift();

/* ---------- Trang chủ giáo viên ---------- */
function tagSplit(q) { const m = String(q).match(/^\s*\[([^\]]{1,60})\]\s*([\s\S]*)$/); return m ? { tag: m[1].trim(), text: m[2].trim() } : { tag: '', text: String(q).trim() }; }
function qaStatusHtml() {
  const n = state.qa.length;
  if (!n) return '<p class="status empty">Chưa có câu hỏi nào. Hãy chọn file Excel ở trên.</p>';
  const rounds = Math.min(3, Math.floor(n / 4));
  let cls = 'ok', extra;
  if (n < 4) { cls = 'err'; extra = 'Cần ít nhất 4 cặp để tạo bài (nên có từ 12 cặp trở lên).'; }
  else if (n < 12) { cls = 'warn'; extra = 'Chỉ đủ ' + rounds + ' vòng (mỗi vòng 4 câu). Hãy thêm câu để có đủ 3 vòng.'; }
  else extra = n > 12 ? 'Mỗi lần chơi sẽ chọn 12 câu theo cách bên dưới.' : 'Đủ 3 vòng × 4 câu.';
  return '<p class="status ' + cls + '" role="status">Đã đọc <b>' + n + '</b> cặp câu hỏi – đáp án' + (state.fileName ? ' từ “' + esc(state.fileName) + '”' : '') + '. ' + extra +
    (state.qa.some(r => r.h) ? ' Có <b>' + state.qa.filter(r => r.h).length + '</b> câu kèm gợi ý khi chọn sai.' : ' Chưa có cột C (gợi ý khi chọn sai), không bắt buộc.') + '</p>';
}
function previewHtml() {
  const rows = state.qa.slice(0, 6);
  if (!rows.length) return '';
  const hasH = state.qa.some(r => r.h);
  return '<div class="preview"><table class="tbl"><thead><tr><th>A. Câu hỏi</th><th>B. Đáp án</th>' + (hasH ? '<th>C. Gợi ý</th>' : '') + '</tr></thead><tbody>' + rows.map(r => {
    const t = tagSplit(r.q);
    return '<tr><td>' + (t.tag ? '<span class="q-tag">' + esc(t.tag) + '</span><br>' : '') + esc(t.text) + '</td><td>' + esc(r.a) + '</td>' + (hasH ? '<td>' + esc(r.h || '') + '</td>' : '') + '</tr>';
  }).join('') + '</tbody></table>' + (state.qa.length > 6 ? '<p class="more">… và ' + (state.qa.length - 6) + ' câu nữa.</p>' : '') + '</div>';
}

async function testBg(which) {
  const sb = which === 'sbg';
  const url = $(sb ? '#tSbg' : '#tBg').value.trim(); state[sb ? 'sbg' : 'bg'] = url; save();
  const st = $(sb ? '#sbgStatus' : '#bgStatus');
  const target = url || (sb ? state.bg : '');
  if (!url) { await setBackground(target); st.innerHTML = '<p class="status empty">' + (sb ? 'Chưa chọn hình riêng, phần học sinh sẽ dùng hình nền chung.' : 'Chưa chọn hình nền.') + '</p>'; return; }
  if (/\/folders\//.test(url)) { st.innerHTML = '<p class="status err">Đây là link thư mục. Hãy lấy link của từng ảnh.</p>'; return; }
  st.innerHTML = '<p class="status empty">Đang tải hình…</p>';
  const ok = await setBackground(url);
  st.innerHTML = ok ? '<p class="status ok" role="status">✓ Đã tải được hình (xem phía sau các khung).</p>'
    : '<p class="status err" role="alert">✗ Không tải được hình. Hãy kiểm tra link và quyền chia sẻ “Bất kỳ ai có đường liên kết”.</p>';
}

function bdClasses() {
  const m = new Map(), add = c => { c = String(c || '').trim(); if (c && c !== '*' && !m.has(norm(c))) m.set(norm(c), c); };
  BD.rows.forEach(r => add(r.cls)); BD.cat.forEach(i => (i.giao || []).forEach(g => add(g.l)));
  Object.keys(state.rosters || {}).forEach(k => { if (String(state.rosters[k] || '').trim()) add(k.toUpperCase()); });

const iin = document.createElement('input'); iin.type = 'file'; iin.id = 'imgInput'; iin.accept = 'image/*'; iin.multiple = true; iin.hidden = true;
document.body.append(xin, iin);
xin.addEventListener('change', () => { if (xin.files[0]) readExcel(xin.files[0]); xin.value = ''; });
iin.addEventListener('change', () => { if (iin.files.length) addFiles(iin.files); iin.value = ''; });

let dragTimer;
document.addEventListener('dragover', e => {
  e.preventDefault();
  const d = $('#drop'); if (d && view === 'home') { d.classList.add('over'); clearTimeout(dragTimer); dragTimer = setTimeout(() => d.classList.remove('over'), 200); }
});
document.addEventListener('drop', e => {
  e.preventDefault();
  const files = e.dataTransfer ? [...e.dataTransfer.files] : [];
  if (!files.length || (view !== 'home' && view !== 'lecture')) return;
  const xl = files.find(x => /\.(xlsx|xls|csv)$/i.test(x.name)), imgs = files.filter(x => /^image\//.test(x.type));
  if (xl) readExcel(xl);
  if (imgs.length) addFiles(imgs);
  if (!xl && !imgs.length) toast('Hãy thả file Excel (.xlsx, .xls, .csv) hoặc file ảnh.');
});
document.addEventListener('paste', e => {
  if (view !== 'lecture' && view !== 'home') return;
  const files = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.kind === 'file' && /^image\//.test(i.type)).map(i => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); addFiles(files.map((f, k) => new File([f], 'Ảnh dán ' + (k + 1) + '.png', { type: f.type }))); }
});

/* ---------- Cổng giáo viên: đăng nhập lần đầu, lần sau tự vào ---------- */
const AUTH_KEY = 'tuhbm_auth_v1';
const authNorm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim();
const authHash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'h' + h.toString(36); };
const authOk = () => { try { return localStorage.getItem(AUTH_KEY) === authHash('thanh hoa'); } catch (e) { return false; } };
function renderLogin() {
  view = 'login'; setBackground('');
  app.innerHTML = '<main class="screen"><section class="card" style="max-width:26rem;margin:12vh auto 0;text-align:center">' + TH.logoHtml('lg') +
    '<p class="eyebrow" style="margin-top:.6rem">Cổng giáo viên</p><h1 style="margin:.2rem 0 .4rem">Đăng nhập</h1>' +
    '<p class="hint" style="margin-top:0">Chỉ cần đăng nhập lần đầu trên máy này, những lần sau sẽ tự vào.</p>' +
    '<form id="loginForm" novalidate style="text-align:left"><label for="loginKey">Mã đăng nhập</label>' +
    '<input type="password" id="loginKey" autocomplete="current-password" autofocus placeholder="Nhập mã giáo viên">' +
    '<div class="err" id="loginErr" role="alert" style="color:#b91c1c;min-height:1.3em;margin-top:.3rem"></div>' +
    '<button class="btn btn-primary btn-lg" type="submit" style="width:100%">Vào</button></form></section></main>';
  const f = $('#loginForm'); setTimeout(() => { const i = $('#loginKey'); if (i) i.focus(); }, 30);
  f.addEventListener('submit', e => {
    e.preventDefault();
    if (authNorm($('#loginKey').value) === 'thanh hoa') { try { localStorage.setItem(AUTH_KEY, authHash('thanh hoa')); } catch (x) { /* vẫn vào được phiên này */ } start(); }
    else { $('#loginErr').textContent = 'Mã chưa đúng, thầy thử lại nhé.'; $('#loginKey').select(); }
  });
}
function start() {
  load();
  slides = state.links.map(u => ({ id: ++uid, kind: 'link', url: u }));
  if (state.bg) setBackground(state.bg);
  renderHome();
}

/* ---------- Khởi động ---------- */
if (authOk()) start(); else renderLogin();
})();
</script>
</body>
</html>
